name: Build OnePlus 12 Kernel (KPM + SukiSU Ultra + SUSFS)

on:
  workflow_dispatch:
    inputs:
      KERNEL_SOURCE:
        description: 'Kernel source repo URL'
        required: true
        default: 'https://github.com/OnePlusOSS/android_kernel_oneplus_sm8650'
      KERNEL_BRANCH:
        description: 'Kernel source branch'
        required: true
        default: 'oneplus/sm8650_v_15.0.0_oneplus12'
      SUSFS_ENABLED:
        description: 'Enable SUSFS patch'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup build environment
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            git curl wget zip unzip \
            bc bison flex libssl-dev libelf-dev \
            python3 python3-pip cpio \
            build-essential libncurses-dev \
            binutils-aarch64-linux-gnu \
            gcc-aarch64-linux-gnu

      - name: Setup Clang toolchain
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 17
          echo "CLANG_PATH=/usr/lib/llvm-17/bin" >> $GITHUB_ENV

      - name: Clone kernel source
        run: |
          git clone --depth=1 \
            -b ${{ github.event.inputs.KERNEL_BRANCH }} \
            ${{ github.event.inputs.KERNEL_SOURCE }} \
            kernel_source
          echo "KERNEL_DIR=$GITHUB_WORKSPACE/kernel_source" >> $GITHUB_ENV

      - name: Inspect kernel build system
        run: |
          cd $GITHUB_WORKSPACE/kernel_source
          echo "=== Root files ==="
          ls
          echo "=== arch/arm64/configs ==="
          ls arch/arm64/configs/
          echo "=== vendor configs ==="
          ls vendor/ 2>/dev/null || echo "No vendor dir"
          echo "=== build.config files ==="
          find . -maxdepth 2 -name "build.config*" 2>/dev/null | head -20
          echo "=== Makefile head ==="
          head -5 Makefile

      - name: Setup SukiSU Ultra
        run: |
          cd ${{ env.KERNEL_DIR }}
          curl -LSs "https://raw.githubusercontent.com/ShirkNeko/SukiSU-Ultra/main/kernel/setup.sh" | bash -s susfs-main
          echo "SukiSU Ultra applied"

      - name: Apply SUSFS patch
        if: ${{ github.event.inputs.SUSFS_ENABLED == 'true' }}
        run: |
          cd ${{ env.KERNEL_DIR }}
          git clone --depth=1 \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            /tmp/susfs4ksu
          PATCH_DIR="/tmp/susfs4ksu/kernel_patches"
          if [ -f "$PATCH_DIR/add_sus_fs_6.1.patch" ]; then
            patch -p1 < "$PATCH_DIR/add_sus_fs_6.1.patch" || true
          fi
          if [ -f "$PATCH_DIR/add_sus_ksu_hooks_v3.patch" ]; then
            patch -p1 < "$PATCH_DIR/add_sus_ksu_hooks_v3.patch" || true
          fi
          echo "SUSFS applied"

      - name: Build kernel
        run: |
          cd ${{ env.KERNEL_DIR }}

          export PATH="/usr/lib/llvm-17/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1

          MAKE_ARGS="ARCH=arm64 O=out CC=clang CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 -j$(nproc --all)"

          # Step 1: Generate base GKI config
          make $MAKE_ARGS gki_defconfig

          # Step 2: Merge vendor fragments on top
          for cfg in \
            arch/arm64/configs/vendor/kalama_GKI.config \
            arch/arm64/configs/vendor/oneplus_GKI.config \
            arch/arm64/configs/vendor/debugfs.config; do
            if [ -f "$cfg" ]; then
              echo "Merging: $cfg"
              ./scripts/kconfig/merge_config.sh -m -O out out/.config "$cfg"
            fi
          done

          # Step 3: Enable KPM and KSU options
          cat >> out/.config << 'EOF'
          CONFIG_KPM=y
          CONFIG_MODULES=y
          CONFIG_MODULE_UNLOAD=y
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_SUS_SU=y
          EOF

          # Step 4: Finalize config
          make $MAKE_ARGS olddefconfig

          # Step 5: Build
          echo "=== Starting kernel build ==="
          make $MAKE_ARGS 2>&1 | tee build.log

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3

          KERNEL_IMAGE="${{ env.KERNEL_DIR }}/out/arch/arm64/boot/Image"
          if [ ! -f "$KERNEL_IMAGE" ]; then
            echo "ERROR: Kernel Image not found!"
            find ${{ env.KERNEL_DIR }}/out -name "Image*" 2>/dev/null
            exit 1
          fi

          cp "$KERNEL_IMAGE" AnyKernel3/

          cat > AnyKernel3/anykernel.sh << 'EOF'
          properties() { '
          kernel.string=SukiSU Ultra + KPM + SUSFS | OnePlus 12
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=OnePlus12
          device.name2=CPH2573
          device.name3=OP595DL1
          supported.versions=16
          '; }
          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=1;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;
          . tools/ak3-core.sh
          . split_img
          . flash_boot
          EOF

          cd AnyKernel3
          zip -r9 "../OnePlus12-SukiSU-KPM-SUSFS-$(date +%Y%m%d).zip" . -x ".git*"
          echo "Package created!"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus12-SukiSU-KPM-SUSFS-kernel
          path: OnePlus12-SukiSU-KPM-SUSFS-*.zip
          retention-days: 7

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: kernel_source/build.log
          retention-days: 3
          
